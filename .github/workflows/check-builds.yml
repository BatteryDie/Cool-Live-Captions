name: Check Builds

on:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # MinGW build (disabled) - uncomment to re-enable MinGW checks
